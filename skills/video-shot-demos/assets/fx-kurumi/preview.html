<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>久留美角色库预览</title><link rel="stylesheet" href="runtime.css"><style>body{margin:0;padding:30px;background:#f3ede0;color:#23382f;font-family:'Microsoft YaHei',sans-serif}main{max-width:1600px;margin:auto}h1{font-size:29px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card{background:#fffdf4;padding:15px;box-shadow:5px 5px 0 #e0d7c3}.viewport{position:relative;height:510px;overflow:hidden;background-color:#f0f0e9;background-image:linear-gradient(45deg,#e1e1d8 25%,transparent 25%),linear-gradient(-45deg,#e1e1d8 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e1e1d8 75%),linear-gradient(-45deg,transparent 75%,#e1e1d8 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}button{margin:8px 6px 2px 0;padding:7px 10px;border:1px solid #a5b4a0;background:#faf6ea;color:#23382f;cursor:pointer}button:hover{background:#e2e9dc}.card h2{font-size:22px;margin:0 0 12px}.fxk-speech{display:none}p{font-size:14px;line-height:1.8;color:#62735f}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){body{padding:18px}.grid{grid-template-columns:1fr}}</style><script src="cast-data.js"></script><script src="runtime.js"></script></head><body><main><h1>FX战士久留美 · 定制角色库</h1><p>12 个 PNG 文件，四人角色，16 种生成动作表情。点击按钮切换四格；可以直接离线打开，不需要先生成影片。</p><div id="cards" class="grid"></div></main><script>
for(const [id,data] of Object.entries(FXKurumi.manifest.characters)){
 const card=document.createElement('section');card.className='card';card.innerHTML='<h2>'+data.name+'</h2><div class="viewport"></div><div class="buttons"></div>';document.getElementById('cards').append(card);
 const view=card.querySelector('.viewport'),actor=FXKurumi.mount({stage:view,character:id,width:320,top:0,offset:0,expression:'explain'});actor.show();
 for(const e of data.expressions){const b=document.createElement('button');b.textContent=e.label;b.dataset.expression=e.id;b.onclick=()=>actor.setExpression(e.id);card.querySelector('.buttons').append(b)}
 const a=document.createElement('a');a.href=data.sheet;a.textContent='查看原始四格 PNG';card.append(a);
}
</script></body></html>
